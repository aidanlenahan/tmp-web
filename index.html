<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Expo Deep Dive</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2a62b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expo Guide">
<style>
  :root{
    --bg:#f3f6f8; --card:#ffffff; --ink:#14232e; --muted:#5a6b78; --accent:#2a62b8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1a22; --card:#172530; --ink:#e7eef3; --muted:#9aacb9; --accent:#7aa7ee; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .card{
    background:var(--card); padding:40px 36px; border-radius:16px; text-align:center;
    max-width:420px; width:90%; box-shadow:0 2px 16px rgba(0,0,0,.08);
  }
  h1{font-size:22px; margin:0 0 10px}
  p{color:var(--muted); font-size:15px; margin:0 0 24px; line-height:1.5}
  a.btn{
    display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
    font-weight:600; font-size:16px; padding:12px 28px; border-radius:999px;
  }
  a.btn:hover{opacity:.9}
</style>
</head>
<body>
  <div class="card">
    <h1>Oct 15 Career Expo</h1>
    <p>Deep-dive research on every employer at today's session — what they do, internship paths, and freshman eligibility.</p>
    <a class="btn" href="oct15-career-expo-deep-dive.html">Open the deep dive</a>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
